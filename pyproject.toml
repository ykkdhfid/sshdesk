[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sshdesk"
version = "0.2.0"
description = "SSH 运维客户端：桌面界面 + 浏览器终端，含监控、诊断、批量执行"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
    "cryptography>=41.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12.0"]
dev = ["pytest>=7.0"]

[project.scripts]
sshdesk = "sshdesk.cli:main"

[tool.setuptools.packages.find]
include = ["sshdesk*"]

[tool.setuptools.package-data]
"sshdesk.web" = ["static/*", "static/vendor/*"]
