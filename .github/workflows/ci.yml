name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 用系统 Python 建 venv。桌面版依赖 tkinter，而 tkinter 是编译进解释器的 C 扩展：
      # apt 装的 python3-tk 只对系统解释器生效，setup-python 那套看不到它。
      - name: Prepare Python and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk

      # httpx2 是测试用的：tests/test_web.py 走 fastapi.testclient，
      # 新版 starlette 在缺少它时直接抛 RuntimeError，测试收集阶段就会中断（退出码 2）。
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Static check
        run: .venv/bin/python -m pyflakes sshdesk tests

      - name: Run tests
        run: .venv/bin/python -m pytest -q
